version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: codex/cuegrove-site
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    target-branch: codex/cuegrove-site
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
